name: itam

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itam}
      POSTGRES_USER: ${POSTGRES_USER:-itam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itam_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-itam}:${POSTGRES_PASSWORD:-itam_password}@db:5432/${POSTGRES_DB:-itam}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.local}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      # exposed so the mobile app can reach the API directly on the LAN
      - "${API_PORT:-4000}:4000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
