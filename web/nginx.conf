server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Browsers may send large cookies set by other apps on "localhost";
    # don't reject those requests (default limit is 8k)
    large_client_header_buffers 8 64k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse proxy API calls to the backend container
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API authenticates with Bearer tokens only - drop unrelated cookies
        proxy_set_header Cookie "";
    }

    # Long-cache hashed build assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri /index.html;
    }
}
